name: reshapes_client
description: "The AI powered Virtual Real World Simulatior"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0 # Adjusted to ensure compatibility, or keep your ^3.9.2 if working

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.1
  geolocator: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # ADDED: The tool to generate icons automatically
  flutter_launcher_icons: ^0.14.4

# --- ICON CONFIGURATION ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false             # DISABLED per your request
  image_path: "assets/images/Reshape_S.png"
  min_sdk_android: 21
  windows:
    generate: true
    icon_size: 48
    image_path: "assets/images/Reshape_S.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/